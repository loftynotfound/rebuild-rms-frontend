# frontend/nginx.container.conf
# Ini nginx DI DALAM container frontend (bukan nginx utama di VPS).
# Taruh file ini di root repo frontend, sejajar dengan Dockerfile.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
